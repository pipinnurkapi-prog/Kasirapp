<!doctype html>
<html lang="id"><head>
<title>Kasirku</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a6b5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasirku">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: strip-3 drawer menu, kasir split screen (barang kiri, keranjang kanan), single-pane on phone. Compact density. */
:root{
  --font-ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#eef2f0; --surface:#ffffff; --surface2:#f5f8f7; --ink:#10201c; --muted:#5b6d68; --line:#d6dfdc;
  --primary:#0a6b5c; --primary-ink:#ffffff; --primary-soft:#dff1ec;
  --accent:#e8a21a; --accent-ink:#2a1c00;
  --good:#17803f; --good-soft:#dcf2e4; --warn:#9a6200; --warn-soft:#fbefd2; --bad:#bf3326; --bad-soft:#fbe3df;
  --shadow:0 0.5rem 1.875rem rgba(10,30,25,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1412; --surface:#15201d; --surface2:#1b2825; --ink:#e7f0ed; --muted:#93a8a2; --line:#263733;
    --primary:#3fbfa8; --primary-ink:#04201b; --primary-soft:#143a33;
    --accent:#f0b030; --accent-ink:#261a00;
    --good:#4cc47c; --good-soft:#143622; --warn:#f0b64a; --warn-soft:#3a2d10; --bad:#f2786b; --bad-soft:#40201c;
    --shadow:0 0.5rem 1.875rem rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1412; --surface:#15201d; --surface2:#1b2825; --ink:#e7f0ed; --muted:#93a8a2; --line:#263733;
  --primary:#3fbfa8; --primary-ink:#04201b; --primary-soft:#143a33;
  --accent:#f0b030; --accent-ink:#261a00;
  --good:#4cc47c; --good-soft:#143622; --warn:#f0b64a; --warn-soft:#3a2d10; --bad:#f2786b; --bad-soft:#40201c;
  --shadow:0 0.5rem 1.875rem rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:0.8125rem;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:0.75rem;padding:1.125rem 0.875rem 0.5625rem;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.menu-btn{width:2.5rem;height:2.5rem;border-radius:0.6875rem;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;flex:none}
.menu-btn:hover{background:var(--primary-soft)}
.ttl{font-size:1rem;font-weight:800;letter-spacing:-.01em}
.sub{font-size:0.7188rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt{min-width:0;flex:1}
.sync{flex:none;border:1px solid var(--line);background:var(--surface2);border-radius:62.4375rem;padding:0.25rem 0.625rem;font-size:0.7188rem;font-weight:700;display:flex;gap:0.375rem;align-items:center;color:var(--muted)}
.sync.ok{color:var(--good);background:var(--good-soft);border-color:transparent}
.sync.busy{color:var(--primary);background:var(--primary-soft);border-color:transparent}
.sync.err{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.notice{flex:none;padding:0.375rem 0.875rem;background:var(--warn-soft);color:var(--warn);font-size:0.75rem;display:flex;gap:0.625rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice button{border:1px solid currentColor;background:transparent;border-radius:0.5rem;padding:2px 0.5625rem;font-size:0.7188rem;font-weight:600}
main{flex:1;min-height:0;overflow:auto;padding:0.75rem 0.875rem}
main.fit{overflow:hidden}
.page{max-width:68.75rem;margin:0 auto;display:flex;flex-direction:column;gap:0.75rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:0.75rem}
.pad{padding:0.8125rem}
.row{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:0.75rem}
.stack{display:flex;flex-direction:column;gap:0.625rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0.625rem}
@media(max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}}
.sec-h{font-size:0.875rem;font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:0.5625rem;padding:0.375rem 0.6875rem;font-weight:600;display:inline-flex;gap:0.375rem;align-items:center;justify-content:center;min-height:2.125rem}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.fill{background:var(--bad);color:#fff}
.btn.sm{padding:0.1875rem 0.5625rem;min-height:1.75rem;font-size:0.75rem;border-radius:0.5rem}
.btn.lg{min-height:2.625rem;font-size:0.875rem;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{width:1.875rem;height:1.875rem;border-radius:0.5rem;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ib:hover{background:var(--surface2)}
.ib.danger{color:var(--bad)}
.ib.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.fld{display:flex;flex-direction:column;gap:0.25rem;min-width:0}
.fld>label,.lbl{font-size:0.7188rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=search],input[type=number],input[type=password],input:not([type]),select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:0.5625rem;padding:0.4375rem 0.625rem;min-height:2.25rem}
textarea{resize:vertical}
input.mini{width:7.5rem;text-align:right}
.search{display:flex;align-items:center;gap:0.4375rem;border:1px solid var(--line);border-radius:0.5625rem;background:var(--surface);padding:0 0.625rem;flex:1;min-width:0}
.search input{border:0;background:transparent;padding:0.4375rem 0;outline:0;min-height:2.125rem}
.search:focus-within{outline:2px solid var(--primary)}
.chips{display:flex;gap:0.375rem;overflow-x:auto;padding:2px 0 0.1875rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:62.4375rem;padding:0.25rem 0.6875rem;font-weight:600;font-size:0.75rem;white-space:nowrap;flex:none}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.seg{display:flex;gap:0.1875rem;background:var(--surface2);border:1px solid var(--line);border-radius:0.625rem;padding:0.1875rem}
.seg button{flex:1;border:0;background:transparent;border-radius:0.5rem;padding:0.375rem 0.5rem;font-weight:700;display:flex;gap:0.375rem;align-items:center;justify-content:center}
.seg button.on{background:var(--primary);color:var(--primary-ink)}
.vt{display:flex;gap:0.25rem;flex:none}
.pill{background:var(--accent);color:var(--accent-ink);border-radius:62.4375rem;font-size:0.6562rem;padding:1px 0.375rem;font-weight:800}
.badge{display:inline-block;border-radius:62.4375rem;font-size:0.6875rem;font-weight:700;padding:1px 0.5rem;background:var(--surface2);color:var(--muted)}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.pri{background:var(--primary-soft);color:var(--primary)}
.empty{padding:1.75rem 0.875rem;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:0.875rem;margin-bottom:0.1875rem}
/* kasir */
.kasir{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0.75rem;height:100%;min-height:0}
.kpane{display:flex;flex-direction:column;min-height:0;min-width:0}
.listpane{padding:0.5625rem;gap:0.5rem}
.kbar{display:flex;gap:0.5rem;align-items:center}
.kscroll{overflow:auto;min-height:0;flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.625rem,1fr));gap:0.5rem;padding:2px}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:0.625rem;padding:0.5rem 0.5625rem;display:flex;flex-direction:column;gap:2px;min-height:4.75rem}
.tile:hover,.prow:hover{border-color:var(--primary);background:var(--primary-soft)}
.tile .tn{font-weight:700;font-size:0.7812rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:1.375rem}
.tile .ts{font-size:0.6875rem;color:var(--primary);font-weight:700}
.tile .tp{margin-top:auto;font-weight:800;font-size:0.7812rem}
.tile .tk,.prow .tk{font-size:0.6875rem;color:var(--muted)}
.tile .tk.low,.prow .tk.low{color:var(--bad);font-weight:700}
.qb{position:absolute;top:0.375rem;right:0.375rem;background:var(--primary);color:var(--primary-ink);border-radius:62.4375rem;font-size:0.6562rem;font-weight:800;padding:0 0.4375rem}
.plist{display:flex;flex-direction:column;gap:0.3125rem}
.prow{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:0.5625rem;padding:0.4375rem 0.625rem;display:flex;gap:0.625rem;align-items:center;width:100%}
.prow .pn{font-weight:700;font-size:0.7812rem;line-height:1.25}
.prow .ps{font-size:0.6875rem;color:var(--primary);font-weight:700}
.prow .pr{text-align:right;flex:none}
.prow .pr b{display:block;font-size:0.7812rem}
.more{margin:0.5rem auto 2px;display:block}
.cart{padding:0;overflow:auto}
.cart-h{padding:0.5rem 0.75rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);flex:none}
.cart-rows{flex:1 1 7.5rem;min-height:7.5rem;overflow:auto}
.crow{padding:0.5rem 0.75rem;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:0.375rem}
.crow.zero{opacity:.62}
.chead{display:flex;gap:0.5rem;justify-content:space-between;align-items:flex-start}
.cname b{display:block;line-height:1.25;font-size:0.7812rem}
.cname span{font-size:0.6875rem;color:var(--primary);font-weight:700}
.cctl{display:flex;gap:0.375rem;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:0.5rem;overflow:hidden;background:var(--surface)}
.step button{width:1.75rem;height:1.875rem;border:0;background:var(--surface2);display:grid;place-items:center}
.step button:hover{background:var(--primary-soft)}
.step input{width:2.875rem;border:0;border-radius:0;text-align:center;min-height:1.875rem;padding:2px}
.prc{display:flex;align-items:center;gap:0.1875rem;border:1px solid var(--line);border-radius:0.5rem;padding-left:0.5rem;background:var(--surface);flex:1 1 6rem;min-width:5.625rem}
.prc span{font-size:0.6875rem;color:var(--muted)}
.prc input{border:0;min-height:1.875rem;padding:2px 0.4375rem 2px 2px;text-align:right}
.csub{margin-left:auto;font-weight:800;font-size:0.7812rem}
.cwarn{font-size:0.6875rem;color:var(--warn)}
.cart-sum{flex:none;padding:0.5625rem 0.75rem;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:0.375rem;background:var(--surface2);border-radius:0 0 0.75rem 0.75rem}
.srow{display:flex;justify-content:space-between;align-items:center;gap:0.5rem}
.srow label{font-size:0.75rem;color:var(--muted);font-weight:600}
.srow select{max-width:11.875rem}
.srow.big{font-size:1rem;font-weight:800}
.srow.big b{font-size:1.125rem}
.quick{display:flex;gap:0.3125rem;flex-wrap:wrap}
.quick .btn{min-height:1.75rem;padding:0.1875rem 0.5625rem;font-size:0.75rem}
.info{font-weight:700;min-height:1rem;text-align:right;font-size:0.7812rem}
.info.good{color:var(--good)}.info.warn{color:var(--warn)}.info.bad{color:var(--bad)}
.ktabs{display:flex}
.tabt{font-weight:600;font-size:0.7188rem;opacity:.85}
@media(min-width:720px){.ktabs{display:none}}
@media(max-width:719px){
  .kasir{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:0.5625rem}
  .kasir[data-pane=barang] .cartpane{display:none}
  .kasir[data-pane=cart] .listpane{display:none}
  .cart-rows{overflow:visible;flex:none;min-height:0}
}
/* list rows */
.list{display:flex;flex-direction:column}
.item{padding:0.625rem 0.8125rem;border-bottom:1px solid var(--line);display:flex;gap:0.625rem;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .nm{font-weight:700;font-size:0.8438rem}
.item .acts{display:flex;gap:0.3125rem;flex-wrap:wrap}
.item .r{text-align:right}
button.item{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);align-items:center;flex-wrap:nowrap;border-radius:0}
button.item:hover{background:var(--surface2)}
.gridb{display:grid;grid-template-columns:repeat(auto-fill,minmax(13.125rem,1fr));gap:0.5rem;padding:0.625rem}
.gcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:0.625rem;padding:0.5625rem 0.6875rem;display:flex;flex-direction:column;gap:0.1875rem}
.gcard:hover{border-color:var(--primary);background:var(--primary-soft)}
.units{display:flex;gap:0.3125rem;flex-wrap:wrap;margin-top:0.3125rem}
.unit{font-size:0.7188rem;background:var(--surface2);border:1px solid var(--line);border-radius:0.4375rem;padding:1px 0.4375rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.625rem,1fr));gap:0.625rem}
.stat{padding:0.75rem;display:flex;flex-direction:column;gap:0.1875rem}
.stat .k{font-size:0.7188rem;font-weight:600;color:var(--muted)}
.stat .v{font-size:1.1875rem;font-weight:800;letter-spacing:-.01em}
.stat.main{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.stat.main .k{color:inherit;opacity:.85}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:26.25rem}
th,td{padding:0.4375rem 0.625rem;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:0.7188rem;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
/* modal, drawer, toast */
.ov{position:fixed;inset:0;background:rgba(8,16,14,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-width:35rem;max-height:92%;display:flex;flex-direction:column;border-radius:1rem 1rem 0 0;box-shadow:var(--shadow)}
.sheet.wide{max-width:52.5rem}
.sheet-h{padding:0.6875rem 0.875rem;display:flex;justify-content:space-between;align-items:center;gap:0.625rem;border-bottom:1px solid var(--line);flex:none}
.sheet-h h2{font-size:0.9375rem;font-weight:800}
.sheet-b{padding:0.8125rem 0.875rem;overflow:auto;min-height:0;flex:1}
.sheet-f{padding:0.625rem 0.875rem calc(0.625rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:0.5rem;justify-content:flex-end;flex-wrap:wrap;flex:none}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:1rem;max-height:88%}.sheet-f{padding-bottom:0.625rem}}
.scrim{position:fixed;inset:0;background:rgba(8,16,14,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(18.125rem,86vw);background:var(--surface);z-index:45;transform:translateX(-104%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.drawer-h{padding:1.25rem 1rem 0.75rem;border-bottom:1px solid var(--line)}
.drawer-h b{font-size:0.9375rem;font-weight:800;display:block}
.drawer nav{padding:0.5rem;display:flex;flex-direction:column;gap:1px;overflow:auto;flex:1}
.nav{display:flex;gap:0.6875rem;align-items:center;padding:0.625rem;border-radius:0.625rem;border:0;background:transparent;text-align:left;font-weight:600;font-size:0.8438rem;width:100%}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--primary-soft);color:var(--primary)}
.drawer-f{padding:0.625rem 1rem calc(0.75rem + env(safe-area-inset-bottom,0px));font-size:0.7188rem;color:var(--muted);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:0.375rem}
.toast{position:fixed;left:50%;bottom:calc(1.375rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:0.5rem 0.875rem;border-radius:0.6875rem;font-weight:600;z-index:90;max-width:min(92vw,27.5rem);text-align:center;box-shadow:var(--shadow)}
.paper{overflow:auto;background:var(--surface2);border:1px dashed var(--line);border-radius:0.6875rem;padding:0.75rem;display:flex;justify-content:center}
.struk{background:#fff;color:#111;font-family:var(--font-mono);font-size:0.7188rem;line-height:1.35;padding:0.75rem 0.625rem;margin:0;white-space:pre;box-shadow:0 2px 0.75rem rgba(0,0,0,.18);flex:none}
.irow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) 4.75rem minmax(0,1fr) auto;gap:0.4375rem;align-items:end;padding:0.5rem 0;border-bottom:1px solid var(--line)}
.irow.ef{grid-template-columns:minmax(0,2fr) 5.25rem minmax(0,1fr) auto}
@media(max-width:620px){.irow,.irow.ef{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.irow .full{grid-column:1/-1}}
.hint{font-size:0.7188rem;color:var(--muted)}
.err{color:var(--bad);font-size:0.75rem;font-weight:600}
.printer{padding:0.75rem;display:flex;flex-direction:column;gap:0.625rem}
.vrow{display:flex;gap:0.625rem;align-items:center;justify-content:space-between;padding:0.5625rem 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.done{display:flex;flex-direction:column;gap:0.5rem}
.done .tot{font-size:1.375rem;font-weight:800}
.acct{display:flex;gap:0.625rem;align-items:center}
.acct img{width:2.25rem;height:2.25rem;border-radius:50%;flex:none;background:var(--surface2)}
@media(prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}

/* ===== Responsif: skala mengikuti lebar layar, orientasi, dan jenis input ===== */
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media(max-width:359px){html{font-size:14.5px}}
@media(min-width:1024px){html{font-size:16.5px}}
@media(min-width:1280px){html{font-size:17px}}
@media(min-width:1600px){html{font-size:18.5px}}
@media(min-width:1920px){html{font-size:21px}}
@media(min-width:2560px){html{font-size:28px}}
@media(min-width:3200px){html{font-size:36px}}
@media(min-width:3840px){html{font-size:42px}}
#app{height:100%;height:100dvh}

function hdrLines(W,title){
  var T=getToko(),Ls=[],hr='-'.repeat(W);
  wrapTxt(T.nama||'Toko',W).forEach(function(x){Ls.push(ctr(x,W));});
  if(T.alamat)wrapTxt(T.alamat,W).forEach(function(x){Ls.push(ctr(x,W));});
  if(T.telp)Ls.push(ctr('Telp '+T.telp,W));
  Ls.push(hr);if(title){Ls.push(ctr(title,W));Ls.push(hr);}
  return Ls;
}
function beliText(t,pr){
  var W=colsOf(pr),hr='-'.repeat(W),Ls=hdrLines(W,'NOTA PEMBELIAN');
  Ls.push(lr('No',t.no,W));Ls.push(lr('Tanggal',fmtDT(t.tgl),W));Ls.push(lr('Suplayer',beliSup(t),W));Ls.push(hr);
  t.items.forEach(function(i){wrapTxt(itemName(i),W).forEach(function(x){Ls.push(x);});Ls.push(lr(qf(i.qty)+' x '+fmtN(i.harga),fmtN(i.qty*i.harga),W));});
  Ls.push(hr);wrapTxt('Total qty: '+qtyText(t.items),W).forEach(function(x){Ls.push(x);});Ls.push(lr('TOTAL',fmtN(t.total),W));Ls.push(lr('Dibayar',fmtN(t.bayar),W));
  var s=sisaOf(t);if(s>0)Ls.push(lr('Sisa hutang',fmtN(s),W));
  Ls.push(hr);
  return Ls.join('\n');
}
function debtText(d,pr){
  var W=colsOf(pr),hr='-'.repeat(W),sup=d.tipe==='sup',Ls=hdrLines(W,sup?'RINCIAN HUTANG':'RINCIAN PIUTANG');
  Ls.push(lr(sup?'Suplayer':'Pelanggan',d.g.nama,W));Ls.push(lr('Dicetak',fmtDT(d.tgl),W));Ls.push(hr);
  d.g.trx.slice().sort(function(a,b){return a.tgl.localeCompare(b.tgl);}).forEach(function(t){

function bayarText(d,pr){

/* ---------- cetak langsung: ESC/POS lewat Bluetooth, Serial, USB, atau dialog sistem ---------- */
function toAscii(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[·•]/g,'-').replace(/[–—−]/g,'-').replace(/[^\x20-\x7e\n]/g,'?');}
function escpos(text,copies){
  var out=[],a=toAscii(text),n=Math.min(3,Math.max(1,parseInt(copies,10)||1)),i,c;
  for(c=0;c<n;c++){out.push(0x1b,0x40);for(i=0;i<a.length;i++)out.push(a.charCodeAt(i));out.push(0x0a,0x1b,0x64,0x04,0x1d,0x56,0x42,0x00);}
  return new Uint8Array(out);
}
function konType(p){var k=p.koneksi||'';if(/serial/i.test(k))return 'serial';if(/usb/i.test(k))return 'usb';if(/sistem|pdf|lan|jaringan/i.test(k))return 'sistem';return 'bt';}
function polOk(f){try{var pp=document.permissionsPolicy||document.featurePolicy;if(pp&&pp.allowsFeature)return pp.allowsFeature(f);}catch(e){}return true;}
function capOf(kind){
  var api=kind==='bt'?'bluetooth':kind;
  if(!navigator[api])return 'tidak didukung';
  if(!polOk(api))return 'diblokir halaman ini';
  return 'tersedia';
}
function capText(){return 'Dukungan perangkat ini: Bluetooth '+capOf('bt')+' · Serial '+capOf('serial')+' · USB '+capOf('usb')+'.';}
var PRN={bt:{},serial:{},usb:{}};
var BT_SVC=['000018f0-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','e7810a71-73ae-499d-8c15-faa9aef0c3f2','0000fee7-0000-1000-8000-00805f9b34fb'];
function unsup(){var e=new Error('Browser atau halaman ini tidak mengizinkan akses langsung ke printer.');e.code='unsupported';return e;}
var waitMs=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
async function sendBT(p,bytes){
  if(!navigator.bluetooth||!polOk('bluetooth'))throw unsup();
  var dev=PRN.bt[p.id];
  if(!dev){
    var nm=(p.alamat||'').trim(),named=nm&&!/^[0-9a-f]{2}([:-][0-9a-f]{2}){5}$/i.test(nm);
    dev=await navigator.bluetooth.requestDevice(named?{filters:[{namePrefix:nm}],optionalServices:BT_SVC}:{acceptAllDevices:true,optionalServices:BT_SVC});
    PRN.bt[p.id]=dev;
  }
  var srv=await dev.gatt.connect(),svcs=await srv.getPrimaryServices(),ch=null,i,j,cs;
  for(i=0;i<svcs.length&&!ch;i++){cs=await svcs[i].getCharacteristics();for(j=0;j<cs.length;j++){if(cs[j].properties.write||cs[j].properties.writeWithoutResponse){ch=cs[j];break;}}}
  if(!ch)throw new Error('Printer tidak punya jalur tulis yang dikenali. Coba opsi Bluetooth klasik atau dialog cetak sistem');
  for(i=0;i<bytes.length;i+=100){
    var part=bytes.slice(i,i+100);
    if(ch.properties.writeWithoutResponse&&ch.writeValueWithoutResponse)await ch.writeValueWithoutResponse(part);else await ch.writeValue(part);
    await waitMs(20);
  }
}
async function sendSerial(p,bytes){
  if(!navigator.serial||!polOk('serial'))throw unsup();
  var port=PRN.serial[p.id];
  if(!port){port=await navigator.serial.requestPort();PRN.serial[p.id]=port;}
  if(!port.writable)await port.open({baudRate:9600});
  var w=port.writable.getWriter();
  try{await w.write(bytes);}finally{w.releaseLock();}
}
async function sendUSB(p,bytes){
  if(!navigator.usb||!polOk('usb'))throw unsup();
  var d=PRN.usb[p.id];
  if(!d){d=await navigator.usb.requestDevice({filters:[]});PRN.usb[p.id]=d;}
  if(!d.opened)await d.open();
  if(!d.configuration)await d.selectConfiguration(1);
  var cand=[];
  d.configuration.interfaces.forEach(function(it){it.alternates.forEach(function(al){al.endpoints.forEach(function(e){if(e.direction==='out')cand.push({it:it,al:al,e:e});});});});
  var pick=cand.find(function(c){return c.al.interfaceClass===7;})||cand[0];
  if(!pick)throw new Error('Port cetak USB tidak ditemukan pada perangkat ini');
  await d.claimInterface(pick.it.interfaceNumber);
  await d.transferOut(pick.e.endpointNumber,bytes);
}
async function sendRaw(kon,p,bytes){
  if(kon==='bt')return sendBT(p,bytes);
  if(kon==='serial')return sendSerial(p,bytes);
  return sendUSB(p,bytes);
}
async function cetak(d,pid){
  var p=PREFS.printers.find(function(x){return x.id===pid;})||PREFS.printers[0];
  var kon=konType(p),text=docText(d,p);
  if(kon==='sistem'){sysPrint(text,p);return;}
  toast('Mencetak ke '+p.nama+'…');
  try{
    await sendRaw(kon,p,escpos(text,p.salinan));
    toast('Terkirim ke '+p.nama);
  }catch(e){
    delete PRN[kon][p.id];
    if(e&&e.name==='NotFoundError'){toast('Pilihan printer dibatalkan');return;}
    var why=(e&&e.code==='unsupported')?'Cetak langsung ke '+p.nama+' tidak tersedia di perangkat atau halaman ini.':'Gagal mencetak ke '+p.nama+': '+((e&&e.message)||'koneksi gagal')+'.';
    showStruk(d,p.id,why+' Gunakan Cetak lewat sistem atau salin teks struk.');
  }
}
function sysPrint(text,p){
  var W=colsOf(p),mm={'58mm':58,'72mm':72,'76mm':76,'80mm':80,'110mm':110,A6:105,A5:148,A4:210,Letter:216}[p.kertas]||58;
  var fs=Math.max(7,Math.min(14,(mm-4)*3.78/(W*0.6)));
  var sz=/mm$/.test(p.kertas)?mm+'mm auto':(p.kertas==='A4'?'A4':p.kertas==='A5'?'A5':p.kertas==='A6'?'A6':p.kertas==='Letter'?'letter':'auto');
  var html='<!doctype html><meta charset="utf-8"><style>@page{size:'+sz+';margin:2mm}html,body{margin:0;background:#fff}pre{margin:0;font:'+fs.toFixed(1)+'px/1.3 monospace;color:#000;white-space:pre}</style><pre>'+esc(text)+'</pre>';
  var f=document.createElement('iframe');f.setAttribute('aria-hidden','true');f.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';
  f.onload=function(){try{f.contentWindow.focus();f.contentWindow.print();}catch(e){toast('Dialog cetak sistem tidak bisa dibuka di sini');}setTimeout(function(){if(f.parentNode)f.parentNode.removeChild(f);},60000);};
  f.srcdoc=html;document.body.appendChild(f);
  toast('Membuka dialog cetak…');
}

var STORE={persisted:null,usage:null,quota:null};
function plat(){var u=navigator.userAgent||'';if(/iPhone|iPad|iPod/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))return 'iOS/iPadOS';if(/Android/.test(u))return 'Android';if(/Windows/.test(u))return 'Windows';if(/Mac/.test(u))return 'macOS';if(/Linux|CrOS/.test(u))return 'Linux/ChromeOS';return 'perangkat ini';}
function fmtB(n){if(n==null)return '-';if(n<1048576)return Math.max(1,Math.round(n/1024))+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(1)+' GB';}
function storageInner(){

  return '<b class="sec-h">Penyimpanan perangkat</b><div class="small">Data toko disimpan di penyimpanan browser (IndexedDB) pada '+esc(plat())+' ini. Tiap perangkat dan tiap browser punya salinan sendiri, tidak tercampur dengan pengguna lain.</div>'+
  '<div class="row between small"><span class="muted">Penyimpanan tetap (persisten)</span><b>'+(STORE.persisted===true?'Ya':(STORE.persisted===false?'Belum':'Tidak diketahui'))+'</b></div>'+
  '<div class="row between small"><span class="muted">Terpakai</span><b class="num">'+fmtB(STORE.usage)+(STORE.quota?' dari '+fmtB(STORE.quota):'')+'</b></div>'+
  '<p class="hint" style="margin:0">'+(ios?'Di iPhone dan iPad, Safari dapat menghapus data situs yang lama tidak dibuka. ':'Menghapus data situs atau data browser akan menghapus data lokal ini. ')+'Aktifkan sinkron akun atau simpan file cadangan secara berkala agar data aman.</p>';
}
async function probeStorage(askPersist){
  try{
    var s=navigator.storage;
    if(s){
      if(askPersist&&s.persist)STORE.persisted=await s.persist();else if(s.persisted)STORE.persisted=await s.persisted();
      if(s.estimate){var e=await s.estimate();STORE.usage=e.usage;STORE.quota=e.quota;}
    }
  }catch(e){}
  var b=$('#storBox');if(b)b.innerHTML=storageInner();
}

  $('#sTot').textContent=rp(T.total);
  var tn=$('#tabN');if(tn){tn.textContent=T.n;$('#tabT').textContent=T.total>0?rp(T.total):'';}
  var q='';
  if(T.total>0){
    var c=[],seen={};
    [5000,10000,20000,50000,100000].forEach(function(u){var v=Math.ceil(T.total/u)*u;if(v!==T.total&&!seen[v]&&c.length<4){seen[v]=1;c.push(v);}});
    q='<button class="btn accent" data-act="payset" data-v="'+T.total+'">Uang pas</button>'+c.map(function(v){return '<button class="btn" data-act="payset" data-v="'+v+'">'+fmtN(v)+'</button>';}).join('')+'<button class="btn soft" data-act="topiutang">Piutang</button>';
  }
  $('#quick').innerHTML=q;
  var info=$('#sInfo'),btn=$('#payBtn');
  info.className='info num';
  if(T.n===0){info.textContent='';btn.disabled=true;btn.textContent='Keranjang kosong';return;}
  if(T.sisa>0){
    info.classList.add('warn');info.textContent='Sisa masuk piutang '+rp(T.sisa);
    if(S.pelId){btn.disabled=false;btn.textContent='Simpan ke Piutang & Selesai';}
    else{btn.disabled=true;btn.textContent='Pilih pelanggan untuk piutang';}
  }else{
    btn.disabled=false;btn.textContent='Bayar & Selesai';
    if(T.kembali>0){info.classList.add('good');info.textContent='Kembali '+rp(T.kembali);}else{info.textContent='';}
  }
}

A.pbSave=function(){
  var err=function(m){$('#pbErr').textContent=m;};
  var items=[];
  for(var i=0;i<pb.items.length;i++){var it=pb.items[i];
    if(!it.barangId)return err('Pilih barang pada baris '+(i+1)+'.');
    var q=dec(it.qty);if(!(q>0))return err('Jumlah baris '+(i+1)+' harus lebih dari 0.');
    var b=G('barang',it.barangId);if(!b)return err('Barang baris '+(i+1)+' sudah dihapus.');var s=b.satuan[it.si];
    items.push({barangId:b.id,nama:b.nama,satuan:s.nama,multi:b.satuan.length>1,isi:s.isi,qty:q,harga:money(it.harga)});}
  var T=pbTotals();
  if(T.sisa>0&&!pb.supId)return err('Pilih suplayer agar sisa pembayaran tercatat sebagai hutang.');
  var rec;
  if(pb.id){
    rec=G('beli',pb.id);if(!rec)return err('Pembelian ini sudah dihapus dari perangkat lain.');
    var sup=G('suplayer',pb.supId);
    rec.supId=sup?sup.id:'';rec.supNama=sup?sup.nama:'';rec.items=items;rec.total=T.tot;rec.bayar=T.by;put('beli',rec);
  }else{rec=mkBeli({items:items,bayar:T.by,supId:pb.supId});}
  if(pb.up&&rec.status!=='batal')items.forEach(function(i){var b=G('barang',i.barangId);if(!b)return;var s=b.satuan.find(function(x){return x.nama===i.satuan&&x.isi===i.isi;});if(s){s.modal=i.harga;put('barang',b);}});
  closeTop();render(true);toast('Pembelian tersimpan, stok diperbarui');
  doneModal(rec,{sisa:sisaOf(rec),kembali:0});
};

var HARI=['Min','Sen','Sel','Rab','Kam','Jum','Sab'],BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function rwBuckets(per,src){
  var n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate(),out=[],i;
  if(per==='week'){var s0=d-((n.getDay()+6)%7);for(i=0;i<7;i++){var x=new Date(y,m,s0+i);out.push({key:ymd(x.toISOString()),label:HARI[x.getDay()]+', '+x.getDate()+' '+BULAN[x.getMonth()].slice(0,3)+' '+x.getFullYear(),cur:i===(n.getDay()+6)%7,fut:i>(n.getDay()+6)%7});}}
  else if(per==='month'){var last=new Date(y,m+1,0).getDate();for(i=1;i<=last;i++){var x2=new Date(y,m,i);out.push({key:ymd(x2.toISOString()),label:HARI[x2.getDay()]+', '+i+' '+BULAN[m],cur:i===d,fut:i>d});}}

}

A.login=async function(){
  if(badOrigin()){showOriginHelp();return;}
  if(!gCid()&&!(KT&&KT.profile)){toast('Isi Client ID Google dulu');return;}
  try{
    toast('Membuka login Google…');
    var t=await gToken(true),me=await gUserInfo(t);
    if(!me||!me.sub)throw gErr('Profil Google tidak terbaca.');
    GP={sub:me.sub,email:me.email||'',name:me.name||'',picture:me.picture||''};
    try{localStorage.setItem('kasirku.gp.'+CUR.key,JSON.stringify(GP));}catch(e){}
    PREFS.off=false;savePrefs();
    await initCloud();
    toast('Masuk sebagai '+(GP.email||GP.name));
  }catch(e){toast(e&&e.code==='network'?'Tidak ada koneksi internet':'Login Google dibatalkan atau gagal: '+((e&&e.message)||''));}
};

A.gSwitch=async function(){
  if(badOrigin()){showOriginHelp();return;}
  if(!gCid()&&!(KT&&KT.profile)){toast('Isi Client ID Google dulu');return;}
  var oldTok=gTok;
  try{
    toast('Pilih akun Google…');
    var t=await gToken(true,true),nt=gTok,me=await gUserInfo(t);
    gTok=oldTok;
    if(!me||!me.sub)throw gErr('Profil Google tidak terbaca.');
    if(GP&&me.sub===GP.sub){gTok=nt;gNeed=false;statusUI();toast('Tetap memakai '+(me.email||me.name));return;}
    ask({title:'Pindah ke '+(me.email||me.name)+'?',msg:'Data toko di perangkat ini akan disinkronkan ke Google Drive akun tersebut dan digabung dengan data kasir yang sudah ada di sana. Drive akun lama tidak diubah.',ok:'Pindah'},async function(){
      stopCloud();gTok=nt;DRIVE=newDrive();
      GP={sub:me.sub,email:me.email||'',name:me.name||'',picture:me.picture||''};
      try{localStorage.setItem('kasirku.gp.'+CUR.key,JSON.stringify(GP));}catch(e){}
      COLS.forEach(function(c){for(var id in D[c]){var r=D[c][id];if(r.u>0)UNS[c+':'+id]=1;}});saveUns();
      delete PREFS.fullAt[acct.uid];PREFS.off=false;savePrefs();cloud.known={};
      await initCloud();toast('Terhubung ke '+(GP.email||GP.name));
    });
  }catch(e){gTok=oldTok;toast(e&&e.code==='network'?'Tidak ada koneksi internet':'Ganti akun dibatalkan atau gagal: '+((e&&e.message)||''));}
};

A.uReg=async function(){
  var n=($('#gU')||{}).value||'',pw=($('#gP')||{}).value||'',pw2=($('#gP2')||{}).value||'',k=ukey(n);
  if(!okName(k)){gateErr('Username 3 sampai 24 karakter: huruf, angka, titik, strip, atau garis bawah.');return;}
  if(UR[k]){gateErr('Username sudah dipakai di perangkat ini.');return;}
  if(pw.length<6){gateErr('Password minimal 6 karakter.');return;}
  if(pw!==pw2){gateErr('Ulangi password tidak sama.');return;}
  var b=$('#gGo');if(b)b.disabled=true;
  try{
    var first=!hasUsers(),salt=newSalt(),h=await hashPw(pw,salt);
    UR[k]={n:n.trim(),s:salt,h:h,t:Date.now()};
    if(first){UR[k].legacy=true;UR[k].mig=true;}
    saveUR();await enter(k,true);
  }catch(e){gateErr(e&&e.message==='nocrypto'?'Browser ini tidak mendukung enkripsi password. Buka lewat https.':'Gagal membuat akun.');if(b)b.disabled=false;}
};
A.uLogin=async function(){
  var k=ukey(($('#gU')||{}).value),pw=($('#gP')||{}).value||'';
  if(!k||!pw){gateErr('Isi username dan password.');return;}
  var b=$('#gGo');if(b)b.disabled=true;
  try{
    var u=UR[k],ok=false;
    if(u){ok=(await hashPw(pw,u.s))===u.h;}else{await hashPw(pw,newSalt());}
    if(!ok){uFail++;await sleep(Math.min(uFail,6)*600);gateErr('Username atau password salah.');if(b)b.disabled=false;return;}
    uFail=0;await enter(k,false);
  }catch(e){gateErr(e&&e.message==='nocrypto'?'Browser ini tidak mendukung enkripsi password. Buka lewat https.':'Gagal masuk.');if(b)b.disabled=false;}
};

A.uPassGo=async function(el){
  var u=CUR&&UR[CUR.key],o=$('#pwO').value,n=$('#pwN').value,n2=$('#pwN2').value,e=$('#pwE');if(!u)return;
  if(n.length<6){e.textContent='Password baru minimal 6 karakter.';return;}
  if(n!==n2){e.textContent='Ulangi password tidak sama.';return;}
  try{
    if((await hashPw(o,u.s))!==u.h){e.textContent='Password lama salah.';return;}
    var salt=newSalt();u.s=salt;u.h=await hashPw(n,salt);saveUR();
    var ov=el.closest('.ov');if(ov)ov.remove();toast('Password diubah');
  }catch(x){e.textContent='Gagal mengubah password.';}
};
function exportJSON(){

}

  $('#bkT',ov).value=txt;$('#bkC',ov).addEventListener('click',function(){var t=$('#bkT',ov);t.focus();t.select();copyText(txt,'Cadangan disalin');});

function restoreText(txt){
  var d;try{d=JSON.parse(txt);}catch(e){return 'Teks cadangan tidak valid.';}
  if(d&&d.v===1&&Array.isArray(d.barang)){
    try{localStorage.setItem('kasirku.v1',txt);}catch(e){}
    if(!migrateV1())return 'Cadangan lama tidak bisa dibaca.';
    return '';
  }
  if(!d||d.v!==2||!d.records)return 'Teks cadangan tidak valid.';
  var n=0;
  COLS.forEach(function(c){(d.records[c]||[]).forEach(function(r){
    if(!r||!r.id||r.x)return;var rec=JSON.parse(JSON.stringify(r));delete rec.u;delete rec.v;delete rec.ex;
    if(c==='toko')rec.id='toko';put(c,rec);n++;});});
  return n?'':'Tidak ada data di cadangan.';
}
A.bkImport=function(){
  var ov=modal('Pulihkan dari teks','<div class="stack"><p class="hint" style="margin:0">Tempel teks cadangan. Data dengan id yang sama ditimpa, data lain tetap ada.</p><textarea id="biT" rows="9" style="font-family:var(--font-mono);font-size:0.6875rem"></textarea><div class="err" id="biE"></div></div>','<button class="btn" data-act="mClose">Batal</button><button class="btn primary" id="biS">Pulihkan</button>');
  $('#biS',ov).addEventListener('click',function(){var m=restoreText($('#biT',ov).value);if(m){$('#biE',ov).textContent=m;return;}ov.remove();resetCartState();render();toast('Data dipulihkan');});
};
CH.bkPick=function(el){
  var f=el.files&&el.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){var m=restoreText(String(rd.result||''));el.value='';if(m){toast(m);return;}resetCartState();render();toast('Data dipulihkan dari file');};
  rd.onerror=function(){toast('File tidak bisa dibaca');};
  rd.readAsText(f);
};
function wipeRecords(only){
  COLS.forEach(function(c){
    if(c==='toko')return;
    L(c).slice().forEach(function(r){if(!only||r.ex)del(c,r.id);});
  });
  var t=getToko();
  if(!only||t.ex){t.nama='Toko Saya';t.alamat='';t.telp='';t.footer='Terima kasih sudah berbelanja';delete t.ex;put('toko',t);}
}
